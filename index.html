    <script>
      (function() {
        var tools = [
          {
            name: "get_studio_info",
            description: "Retrieve FREEWILL.STUDIO digital agency capabilities, services, tech stack, and contact links.",
            inputSchema: { type: "object", properties: { topic: { type: "string" } } },
            execute: async function() { return { studio: "FREEWILL.STUDIO", domain: "freewillstudiotech.com", services: ["Web Apps", "High-Converting Websites", "Automations", "UI/UX"] }; }
          },
          {
            name: "navigate_to_section",
            description: "Navigate or scroll to specific sections on FREEWILL.STUDIO.",
            inputSchema: { type: "object", required: ["target"], properties: { target: { type: "string" } } },
            execute: async function(p) { return { status: "success", target: p.target }; }
          },
          {
            name: "submit_project_brief",
            description: "Submit a project brief questionnaire to FREEWILL.STUDIO.",
            inputSchema: { type: "object", required: ["name", "email", "project_type"], properties: { name: { type: "string" }, email: { type: "string" }, project_type: { type: "string" } } },
            execute: async function(p) { return { status: "received", briefUrl: "https://freewillstudiotech.com/cuestionario" }; }
          }
        ];
        function reg() {
          try {
            var mc = navigator.modelContext || window.modelContext;
            if (mc) {
              if (typeof mc.provideContext === "function") mc.provideContext({ tools: tools });
              if (typeof mc.registerTool === "function") tools.forEach(function(t) { try { mc.registerTool(t); } catch(e){} });
            }
          } catch(e){}
        }
        reg();
        window.addEventListener("DOMContentLoaded", reg);
      })();
    </script>
